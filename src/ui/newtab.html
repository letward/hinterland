<!doctype html>
<html lang="de" data-theme="dark">
  <head>
    <meta charset="utf8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hinterland</title>
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/newtab.css" />
  </head>
  <body class="start">
    <div class="backdrop" id="backdrop"></div>
    <main class="stage" id="stage">
      <section class="welcomeCard" id="welcomeCard" hidden>
        <button class="welcomeClose" id="welcomeClose" type="button" aria-label="Close">&times;</button>
        <div class="welcomeBadge">Hinterland Setup</div>
        <h2 class="welcomeTitle" id="welcomeTitle"></h2>
        <p class="welcomeSubtitle" id="welcomeSubtitle"></p>
        <div class="welcomePillars">
          <div class="welcomePillar">
            <span class="pillarIcon">🛡️</span>
            <div>
              <strong id="pillarPrivacyTitle"></strong>
              <span id="pillarPrivacyDesc"></span>
            </div>
          </div>
          <div class="welcomePillar">
            <span class="pillarIcon">⚡</span>
            <div>
              <strong id="pillarSpeedTitle"></strong>
              <span id="pillarSpeedDesc"></span>
            </div>
          </div>
          <div class="welcomePillar">
            <span class="pillarIcon">🎨</span>
            <div>
              <strong id="pillarCustomTitle"></strong>
              <span id="pillarCustomDesc"></span>
            </div>
          </div>
        </div>
        <div class="welcomeActions">
          <button class="button primary" id="welcomeSetDefault" type="button"></button>
          <button class="button" id="welcomeOpenGuide" type="button"></button>
          <button class="button" id="welcomeDismiss" type="button"></button>
        </div>
      </section>

      <section class="hero">
        <img class="heroLogo" id="heroLogo" src="hinterland://assets/icon.png" alt="Hinterland" />
        <div class="greeting" id="greeting"></div>
        <div class="clock" id="clock" hidden></div>
        <form class="searchBox" id="searchBox">
          <span class="searchIcon" id="searchIcon"></span>
          <input
            class="searchInput"
            id="searchInput"
            type="text"
            spellcheck="false"
            autocomplete="off"
            placeholder=""
          />
          <button class="searchGo" id="searchGo" type="submit"></button>
        </form>
      </section>

      <section class="links" id="links" hidden></section>

      <footer class="foot" id="foot"></footer>
    </main>

    <div class="editSheet" id="editSheet" hidden>
      <div class="editCard">
        <h2 id="editTitle"></h2>
        <p class="editHint" id="editHint"></p>
        <div class="listEditor" id="linkEditor"></div>
        <div class="actionRow" style="margin-top: 14px">
          <button class="button primary" id="linkAdd" type="button"></button>
          <button class="button" id="linkClose" type="button"></button>
        </div>
      </div>
    </div>

    <script type="module" src="js/newtab.js"></script>
  </body>
</html>
